# Third-party Claude Code plugin marketplaces: plugin, marketplace, repository
# Plugins not listed here come from claude-plugins-official
# Read by configs/default.nix (extraKnownMarketplaces, enabledPlugins),
# configs/claude/hooks/sync-plugins.sh (registers and updates them)
# and configs/claude/hooks/check-new-plugins.sh (waits for their registration)

# engineering skills from spec to ship (its hook scripts are not wired)
agent-skills        addy-agent-skills        addyosmani/agent-skills
# terse replies and token savings (hooks)
caveman             caveman                  JuliusBrussee/caveman
# everything claude code: agents, skills and commands (hooks)
ecc                 ecc                      affaan-m/ECC
# keeps changes small and shortcuts on record (hooks)
ponytail            ponytail                 DietrichGebert/ponytail
# deep-first workflows and subagent roles; models are set by /pstack:setup-pstack
pstack              cursor-plugins           cursor/plugins
# question explainer pane (mod)
qa-guide            claude-qamods            aieo-product/claude_qamods
# upstream, not a possibly-stale mirror in the official marketplace
superpowers         superpowers-marketplace  obra/superpowers-marketplace
superpowers-chrome  superpowers-marketplace  obra/superpowers-marketplace
# frontend design taste (skill)
taste-skill         taste-skill              Leonxlnx/taste-skill
# ui/ux design database and search (skills)
ui-ux-pro-max       ui-ux-pro-max-skill      nextlevelbuilder/ui-ux-pro-max-skill
# japanese input in the prompt box (mod); needs `anthy-agent` on PATH
vime                claude-vime              skanehira/claude-vime
# rewrites AI-generated japanese into natural japanese (skill)
yomiyasu            yomiyasu                 nanaism/yomiyasu
