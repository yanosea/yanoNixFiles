# Third-party agent packages shared across the agent clis (declarative)
# Each package is declared once here, with the clis it goes to. The per-cli
# catalogs (configs/*/plugins.conf) stay the place for each cli's own
# marketplace; a package declared here is left out of them.
# Read by lib/agent-packages.nix, through configs/default.nix
#
#   <package> <marketplace> <repository> <cli>[=<value>]...
#
# <marketplace> and <repository> are the claude-format marketplace that ships
# the package as a plugin, or `-` for a bare skill. A line that starts with
# whitespace continues the line above. The <cli> tokens:
#   copilot, antigravity  the plugin <package>@<marketplace>
#   grok[=xai]          the plugin installed straight from <repository> (grok
#                       does not resolve plugins by name from claude-format
#                       marketplaces), or <package> from xAI Official
#   opencode=npm:<spec> an npm plugin, pinned in <spec>
#   opencode=, kiro=,   skill:<input>/<path> links one skill folder of the flake
#   grok=
#                       input, skills:<input>/<path>[!<skip>...] every skill
#                       folder under it but the skipped ones
#   kiro=steering:<input>/<path>  a kiro steering file
#   skill=<input>/<path> a bare skill, linked where configs/agents/skills goes:
#                       ~/.agents/skills (opencode, grok and copilot read it),
#                       antigravity and kiro.
#                       skill=pkg:<attr> builds it from the nixpkgs package
#   -<cli>              leaves a skill= package out of agents
#                       (~/.agents/skills), antigravity or kiro
#
# grok has no way to turn a plugin off for one run, and openclaw runs grok
# from my GROK_HOME, so the packages with hooks stay out of grok's plugins
# (caveman gets its skill folder instead). superpowers is the exception:
# grok had it from xAI before this list.

# engineering skills from spec to ship (its hook scripts are not wired).
# superpowers ships test-driven-development under the same name, and the
# clis that load bare skills have no plugin namespace to tell them apart
agent-skills   addy-agent-skills        addyosmani/agent-skills
  copilot antigravity grok
  opencode=skills:agent-skills/skills!test-driven-development
  kiro=skills:agent-skills/skills!test-driven-development

# terse replies and token savings (hooks)
caveman        caveman                  JuliusBrussee/caveman
  copilot antigravity
  opencode=skill:caveman/skills/caveman kiro=skill:caveman/skills/caveman
  grok=skill:caveman/skills/caveman

# everything claude code: agents, skills and commands (hooks). upstream
# installs the opencode and kiro copies through its install.sh only
ecc            ecc                      affaan-m/ECC
  copilot antigravity

# keeps changes small and shortcuts on record (hooks); the opencode plugin
# registers its skills and always-on ruleset itself
ponytail       ponytail                 DietrichGebert/ponytail
  copilot antigravity
  opencode=npm:@dietrichgebert/ponytail@5.3.2
  kiro=steering:ponytail/.kiro/steering/ponytail.md

# deep-first workflows and subagent roles; models are set by
# /pstack:setup-pstack. upstream ships claude and cursor harnesses, and xAI
# lists it for grok
pstack         cursor-plugins           cursor/plugins
  grok=xai

# upstream, not a possibly-stale mirror in the official marketplace (hooks)
superpowers    superpowers-marketplace  obra/superpowers-marketplace
  copilot antigravity grok=xai
  opencode=npm:superpowers@git+https://github.com/obra/superpowers.git#v7.0.0
  kiro=skills:superpowers/skills

# frontend design taste (skill). installed from the repository, grok would
# load every skill folder in it, so it gets the one skill instead
taste-skill    taste-skill              Leonxlnx/taste-skill
  copilot antigravity grok=skill:taste-skill/skills/taste-skill
  opencode=skill:taste-skill/skills/taste-skill
  kiro=skill:taste-skill/skills/taste-skill

# ui/ux design database and search (skills). its skill calls scripts through
# ${CLAUDE_PLUGIN_ROOT}, so the clis without plugins do not get it
ui-ux-pro-max  ui-ux-pro-max-skill      nextlevelbuilder/ui-ux-pro-max-skill
  copilot antigravity grok

# knowledge graph of a codebase; one SKILL.md per cli
graphify       -                        -
  skill=pkg:graphify

# research skill
imozuru        -                        -
  skill=imozuru/skills/imozuru

# reverse engineering; the skill drives the rea mcp server, which kiro does
# not get, since its mcp config is not managed here
rea            -                        -
  skill=rea/.agents/skills/reverse-engineer-anything -kiro
