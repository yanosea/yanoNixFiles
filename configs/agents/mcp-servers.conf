# MCP server declaration list for opencode and Antigravity (declarative management)
# Single source of truth, one server per non-comment line:
#   <name> [-e KEY=VALUE | -t <transport>]... -- <command> [args...]
# opencode: configs/default.nix writes them into opencode.json as local servers.
# Antigravity: configs/antigravity/scripts/sync-mcp-servers.sh passes each line
# to `agy mcp add`; the opencode agent-sync plugin runs it when a session
# starts. Undeclared agy servers are REMOVED, so a server added by hand with
# `agy mcp add` disappears on the next sync unless it is declared here.

# ComfyUI control plane: talks to the already-running ComfyUI instance
# (started via `start-comfyui`, listens on 127.0.0.1:8188). No separate
# ComfyUI install/workspace — auto-detects the existing local server.
comfyui -e COMFYUI_URL=http://127.0.0.1:8188 -- npx -y comfyui-mcp

# InvokeAI control plane: talks to the already-running InvokeAI instance
# (started via `start-invokeai`, listens on 127.0.0.1:9090, hardcoded in
# the package — no URL override). Both `python -m` and the `mcp<2` pin are
# required: invokeai-mcp-server 1.0.1's console script calls the async
# main() without asyncio.run(), and mcp 2.0 dropped the Server decorators
# the code relies on.
invokeai -- uvx --from invokeai-mcp-server --with mcp<2 python -m invokeai_mcp_server

# rea (reverse engineering): the reverse-engineer-anything skill drives it.
# Pinned to the release the skill is linked from (the `rea` flake input).
rea -- npx -y rea-agents@6.7.0 mcp
