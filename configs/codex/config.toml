# Codex CLI config with shared agent hooks
#
# The new first-line marker prevents the previously deployed SessionEnd saver
# from replacing this unapplied migration with its old live configuration.
# Normal saving resumes once activation deploys this same marker.
#
# Deployed by a copy in configs/default.nix, not a store symlink: codex appends
# its own state here ([hooks.state] hook-trust hashes, [projects.*] trust_level)
# and those writes fail against a read-only store path. Activation merges the
# declared settings while retaining hook-trust, project-trust and unrelated
# hooks. A new or changed hook still requires the user's normal trust decision.
#
# Settings that should not be published live in `config.local.toml` next to the
# deployed copy; activation prepends that file, so its top-level keys land ahead
# of the first table here and stay out of this repository.

# approvals go to an automatic reviewer; sandbox_mode completes the preset
approval_policy = "on-request"
approvals_reviewer = "auto_review"
model_reasoning_effort = "high"
# read legacy project instructions when AGENTS.md is absent
project_doc_fallback_filenames = ["CLAUDE.md"]
# shared AGENTS.md limit: Antigravity truncates a rule file above 24,000 bytes
project_doc_max_bytes = 24000
sandbox_mode = "workspace-write"
model = "gpt-6-astra"
plan_mode_reasoning_effort = "high"

[agents]
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

[features]
# on by default in 0.153.4, pinned explicitly so a default flip cannot kill the hooks
hooks = true
multi_agent = true
# enabled deliberately to retain useful context between sessions
memories = true

[skills]
# 10000 is the documented ceiling; the default is 2% of the context window, which
# the installed plugins blow past and that drops every skill description
max_context_tokens = 10000

[tui]
# everforest dark medium, the palette the rest of this repo uses
theme = "everforest-dark"
# trimmed from the full 29: codex has no wrap option, so the line is clipped
# at terminal width and everything past it is simply lost. Ordered like the
# claude-powerline lines: directory, git, cost, context, limits, model, version
status_line = [
  "current-dir",
  "git-branch",
  "branch-changes",
  "used-tokens",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "model-with-reasoning",
  "run-state",
  "codex-version",
  "task-progress",
  "pull-request-number",
  "permissions",
  "approval-mode",
  "thread-credits",
  "fast-mode",
]
# render the items with the active /theme colours
status_line_use_colors = true
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

# third-party plugin marketplaces, the ones `codex plugin marketplace add`
# would record; their plugins are declared in plugins.conf. the table names
# are the marketplace names the repositories declare, and sync-plugins.sh
# clones a new one before it adds the plugin
[marketplaces.agent-skills]
source_type = "git"
source = "https://github.com/addyosmani/agent-skills.git"

[marketplaces.caveman]
source_type = "git"
source = "https://github.com/JuliusBrussee/caveman.git"

[marketplaces.ecc]
source_type = "git"
source = "https://github.com/affaan-m/ECC.git"

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[marketplaces.taste-skill]
source_type = "git"
source = "https://github.com/Leonxlnx/taste-skill.git"

[marketplaces.ui-ux-pro-max-skill]
source_type = "git"
source = "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git"

# mcp servers: same set as configs/agents/mcp-servers.conf, declared natively
# (codex reads them straight from config.toml, so no sync hook is needed)

# Provided by the cloudflare plugin too, but `codex mcp login` only sees servers
# declared here, so without this duplicate its OAuth flow cannot be started.
[mcp_servers.cloudflare-api]
url = "https://mcp.cloudflare.com/mcp"

# ComfyUI control plane: talks to the already-running ComfyUI instance
# (started via `start-comfyui`, listens on 127.0.0.1:8188).
[mcp_servers.comfyui]
command = "npx"
args = ["-y", "comfyui-mcp"]
env = { COMFYUI_URL = "http://127.0.0.1:8188" }

# InvokeAI control plane: talks to the already-running InvokeAI instance
# (started via `start-invokeai`, listens on 127.0.0.1:9090, hardcoded in the
# package). Both `python -m` and the `mcp<2` pin are required.
[mcp_servers.invokeai]
command = "uvx"
args = [
  "--from",
  "invokeai-mcp-server",
  "--with",
  "mcp<2",
  "python",
  "-m",
  "invokeai_mcp_server",
]

# rea (reverse engineering): the reverse-engineer-anything skill drives it.
# Pinned to the release the skill is linked from; rea's own setup gives
# codex a 30 second startup timeout.
[mcp_servers.rea]
command = "npx"
args = ["-y", "rea-agents@6.7.0", "mcp"]
startup_timeout_sec = 30

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = "bash ~/.config/codex/hooks/save-config.sh"
# SessionEnd is capped at 3s; anything larger is clamped with a warning
timeout = 3

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = 'python3 "$HOME/.agents/hooks/common_hook.py" --harness codex --event SessionEnd'
timeout = 3

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash ~/.config/codex/hooks/check-new-plugins.sh"
timeout = 10

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash ~/.config/codex/hooks/sync-plugins.sh"
async = true
timeout = 300

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash ~/.config/codex/hooks/check-model-drift.sh"
timeout = 10

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness codex --event SessionStart"
timeout = 30

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness codex --event UserPromptSubmit"
timeout = 30

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness codex --event PreToolUse"
timeout = 30

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness codex --event PostToolUse"
timeout = 30

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness codex --event Stop"
timeout = 120

[[hooks.PreCompact]]

[[hooks.PreCompact.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness codex --event PreCompact"
timeout = 30


[notice]
hide_rate_limit_model_nudge = true

# Pause only an explicitly active development loop on native cancellation/end.
[[hooks.Interrupt]]

[[hooks.Interrupt.hooks]]
type = "command"
command = 'python3 "$HOME/.agents/hooks/common_hook.py" --harness codex --event Interrupt'
timeout = 3
