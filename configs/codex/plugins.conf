# Codex CLI plugin declaration list (declarative management)
# Anything not listed here is always treated as not installed (new plugins are never auto-installed)
# [x] = install / [ ] = exclude, uninstall if present
# Entries are full plugin ids in `<name>@<marketplace>` form, as reported by
# `codex plugin list --available --json`.
# Applied by ~/.config/codex/hooks/sync-plugins.sh (runs on SessionStart, reconciles declared vs actual state)
# New plugins are detected by ~/.config/codex/hooks/check-new-plugins.sh
#
# The marketplace exposes no category or description field, so the trailing
# `# category` comments are guessed from the plugin name and are not authoritative.
#
# When config.toml eventually moves into the Nix-managed configs/ tree it turns
# into a read-only store symlink, and codex can no longer record installs there.
# At that point `[plugins."<id>"] enabled = true` tables have to be generated
# into config.toml from the `[x]` lines below, and this hook drops to populating
# the plugin cache only.
