[cli]
auto_update = false

[models]
default = "grok-4.7"

[memory_v2]
enabled = true

[ui]
max_thoughts_width = 100
yolo = false
compact_mode = false
show_timeline = true
simple_mode = false
theme = "auto"
auto_dark_theme = "tokyonight"
auto_light_theme = "grokday"
collapsed_edit_blocks = true
hunk_tracker_mode = "all_dirty"
permission_mode = "auto"
voice_stt_language = "ja"
combine_queued_prompts = true
invert_scroll = false
scroll_mode = "auto"

[ui.status_line]
type = "command"
command = "bash ~/.agents/statusline.sh"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[mcp_servers.comfyui]
command = "npx"
args = [
    "-y",
    "comfyui-mcp",
]

[mcp_servers.comfyui.env]
COMFYUI_URL = "http://127.0.0.1:8188"

[mcp_servers.invokeai]
command = "uvx"
args = [
    "--from",
    "invokeai-mcp-server",
    "--with",
    "mcp<2",
    "python",
    "-m",
    "invokeai_mcp_server",
]

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash ~/.config/grok/hooks/sync-plugins.sh"
timeout = 10

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness auto --event SessionStart"
timeout = 30

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "bash ~/.config/grok/hooks/inject-context.sh"
timeout = 10

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness auto --event PostToolUse"
timeout = 30

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = "bash ~/.config/grok/hooks/save-config.sh"
timeout = 10

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness auto --event UserPromptSubmit"
timeout = 30

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness auto --event PreToolUse"
timeout = 30

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness auto --event Stop"
timeout = 120

[[hooks.PreCompact]]

[[hooks.PreCompact.hooks]]
type = "command"
command = "python3 \"$HOME/.agents/hooks/common_hook.py\" --harness auto --event PreCompact"
timeout = 30
