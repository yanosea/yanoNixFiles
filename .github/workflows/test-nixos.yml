name: Test NixOS
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  # checkout only; jobs that need more declare it themselves
  contents: read
jobs:
  test-nixos-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - yanoNixOs
          - yanoNixOsWsl
    steps:
      - name: free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, so do not leave the token in .git/config
          persist-credentials: false
      - name: install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-nixos-${{ matrix.configuration }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-nixos-${{ matrix.configuration }}-
          gc-max-store-size: 3221225472
          purge: true
          purge-prefixes: nix-${{ runner.os }}-nixos-${{ matrix.configuration }}-
          purge-created: 0
          purge-primary-key: never
      - name: check NixOS configuration - ${{ matrix.configuration }}
        run: |
          # validate configuration syntax and dependencies
          nix eval .#nixosConfigurations.${{ matrix.configuration }}.config.system.build.toplevel.drvPath \
            --show-trace
      - name: build NixOS configuration - ${{ matrix.configuration }}
        run: |
          # actually build so compile/link failures are caught
          nix build .#nixosConfigurations.${{ matrix.configuration }}.config.system.build.toplevel \
            --show-trace
  test-home-manager-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - "yanosea@yanoNixOs"
          - "yanosea@yanoNixOsWsl"
    steps:
      - name: free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, so do not leave the token in .git/config
          persist-credentials: false
      - name: install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: check Home Manager configuration - ${{ matrix.configuration }}
        run: |
          # validate configuration syntax and dependencies
          nix eval .#homeConfigurations.\"${{ matrix.configuration }}\".activationPackage.drvPath \
            --show-trace
      - name: build Home Manager configuration - ${{ matrix.configuration }}
        run: |
          # actually build so compile/link failures are caught
          nix build .#homeConfigurations.\"${{ matrix.configuration }}\".activationPackage \
            --show-trace
  report-status:
    runs-on: ubuntu-latest
    needs:
      - test-nixos-builds
      - test-home-manager-builds
    if: always() && github.event_name == 'pull_request'
    permissions:
      # post the rollup commit status
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: determine overall status
        id: status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Some tests failed" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "state=error" >> "$GITHUB_OUTPUT"
            echo "description=Tests were cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=All tests passed" >> "$GITHUB_OUTPUT"
          fi
      - name: report commit status
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          STATE: ${{ steps.status.outputs.state }}
          DESCRIPTION: ${{ steps.status.outputs.description }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            -f state="$STATE" \
            -f target_url="$TARGET_URL" \
            -f description="$DESCRIPTION" \
            -f context='Test NixOS'
